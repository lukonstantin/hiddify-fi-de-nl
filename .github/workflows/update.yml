name: Update VPN subscriptions

on:
  push:
    branches:
      - main
      - fix/hiddify-source-validation-20261117
    paths:
      - 'mobile_filter.py'
      - 'filter.py'
      - 'europe_filter.py'
      - 'subscription_builder.py'
      - 'test_subscription_builder.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test subscription filters
        run: python -m unittest -v test_subscription_builder.py

      - name: Update FI-DE-NL
        run: python filter.py

      - name: Update Europe
        run: python europe_filter.py

      - name: Update mobile
        run: python mobile_filter.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add filtered.txt europe.txt mobile.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update VPN subscriptions"
            git push
          fi
